version = 1
revision = 2
requires-python = ">=3.10"

[[package]]
name = "demo"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "fastmcp" },
    { name = "httpx" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "fastmcp", specifier = "==2.3.4" },
    { name = "httpx", specifier = "==0.28.1" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = "==8.4.1" }]

[[package]]
name = "fastmcp"
version = "2.3.4"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "anyio" },
]

[[package]]
name = "httpx"
version = "0.28.1"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "anyio"
version = "4.9.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.4.1"
source = { registry = "https://pypi.org/simple" }
